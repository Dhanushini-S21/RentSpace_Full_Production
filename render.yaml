services:
  - type: web
    name: rentspace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rentspace-db
          property: connectionString
      - key: APP_ENV
        value: production

databases:
  - name: rentspace-db
    plan: free
